name: Deploy verified browser release
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'
      - name: Download immutable release and check its published digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node scripts/version.mjs)
          mkdir -p dist/pages
          gh release download "v$VERSION" --repo HhWw96/moonmmdb --pattern moonmmdb-${VERSION}-offline.html --pattern SHA256SUMS --dir dist/pages
          cd dist/pages
          grep "  moonmmdb-${VERSION}-offline.html$" SHA256SUMS | sha256sum --check
          cp moonmmdb-${VERSION}-offline.html index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4
