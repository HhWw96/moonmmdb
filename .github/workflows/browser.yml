name: Browser product validation
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md', 'verification/releases/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      MOONBIT_INSTALL_VERSION: 0.10.11+6ff76a5f9
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install fixed MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install fixed MoonBit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build self-contained browser product
        run: |
          npm ci --prefix web
          node scripts/build.mjs
          python scripts/inspection-fixtures.py
          npm run typecheck --prefix web
          npm run build --prefix web
          python -m pip install --target .reference-deps -r requirements-reference.txt
          python -m pip install psutil==7.2.2
          python scripts/download-production.py
          python web/oracle.py --production
      - name: Install isolated test browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: Chromium online and offline product
        run: |
          node web/verify.mjs
          node web/verify.mjs --file
      - name: Firefox online and offline product
        env:
          BROWSER_ENGINE: firefox
        run: |
          node web/verify.mjs
          node web/verify.mjs --file
      - name: Thirty minute isolated Chromium process-tree soak
        run: node web/soak.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: verification/local/browser/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-package-${{ matrix.os }}
          path: dist/web/
