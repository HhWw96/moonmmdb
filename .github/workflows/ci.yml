name: Verify MoonMMDB
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MOONBIT_INSTALL_VERSION: 0.10.11+6ff76a5f9
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install official MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install official MoonBit (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Core, CLI, consumer and hostile input verification
        run: node scripts/verify.mjs
      - name: Install independent reference
        run: python -m pip install --target .reference-deps -r requirements-reference.txt
      - name: Compare actual MoonBit build with reference readers
        run: python scripts/reference-verify.py
      - name: Verify archive from a fresh consumer
        run: python scripts/package-verify.py
      - name: Save performance conditions and results
        run: node scripts/benchmark.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: moonmmdb-evidence-${{ matrix.os }}
          path: verification/local/
