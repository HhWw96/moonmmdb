name: Verify MoonMMDB
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MOONBIT_INSTALL_VERSION: 0.10.11+6ff76a5f9
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install official MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install official MoonBit (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install independent reference
        run: python -m pip install --target .reference-deps -r requirements-reference.txt
      - name: Verify sources, references, scale, package and performance together
        run: node scripts/release-verify.mjs
      - name: Network export transport checks
        run: |
          python scripts/inspection-fixtures.py
          node scripts/inspection-cli-verify.mjs
      - name: Linux Native core and independent analytics consumer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/moon.mjs test --target native -p HhWw96/moonmmdb --deny-warn
          node scripts/moon.mjs test --target native --release -p HhWw96/moonmmdb --deny-warn
          node scripts/moon.mjs test --target native --release -p HhWw96/moonmmdb/geo --deny-warn
          node --input-type=module -e "import {runMoon} from './scripts/moon.mjs'; runMoon(['test','--target','native','--release','-p','local/moonmmdb_typed_example','--deny-warn'],'examples/typed_consumer');"
          node --input-type=module -e "import {runMoon} from './scripts/moon.mjs'; runMoon(['test','--target','native','--release','-p','local/moonmmdb_log_analytics','--deny-warn'],'examples/log_analytics');"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: moonmmdb-evidence-${{ matrix.os }}
          path: verification/local/
          compression-level: 6
