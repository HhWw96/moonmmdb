name: Verify published artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  downloaded:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Download immutable versioned release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node scripts/version.mjs)
          gh release download "v$VERSION" --repo HhWw96/moonmmdb --dir dist/downloaded
      - name: Check digests and run extracted Native commands without developer paths
        run: python scripts/published-verify.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: downloaded-${{ matrix.os }}
          path: verification/local/published.json
