name: Downloaded 0.9.0 release acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  downloaded:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            archive: moonmmdb-0.9.0-windows-x64.zip
          - os: ubuntu-22.04
            archive: moonmmdb-0.9.0-linux-x64.tar.gz
          - os: ubuntu-24.04
            archive: moonmmdb-0.9.0-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Confirm only the acceptance workflow differs from the released tag
        run: |
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','v0.9.0','HEAD'],text=True).splitlines()
          assert changed==['.github/workflows/native.yml'],changed
          PY
      - name: Download published assets and release metadata
        run: |
          mkdir -p verification/local/downloaded
          gh release download v0.9.0 --repo HhWw96/moonmmdb --dir verification/local/downloaded
          gh release view v0.9.0 --repo HhWw96/moonmmdb --json tagName,targetCommitish,publishedAt,assets > verification/local/downloaded-release.json
      - name: Verify downloaded bytes and isolate the Native executable
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('verification/local/downloaded')
          hashes={}
          for line in (root/'SHA256SUMS').read_text().splitlines():
              expected,name=line.split('  ',1)
              assert Path(name).name==name
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual==expected,name
              hashes[name]=actual
          command=['python','scripts/native-package.py','--verify',str(root/'${{ matrix.archive }}')]
          receipt=json.loads(subprocess.check_output(command,text=True,encoding='utf-8'))
          receipt['downloaded_assets']=hashes
          receipt['release_commit']=subprocess.check_output(['git','rev-parse','v0.9.0'],text=True).strip()
          receipt['acceptance_commit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          receipt['runner']='${{ matrix.os }}'
          Path('verification/local/downloaded-acceptance.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: downloaded-acceptance-${{ matrix.os }}
          path: |
            verification/local/downloaded-acceptance.json
            verification/local/downloaded-release.json
